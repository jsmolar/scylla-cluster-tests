# Nemesis exclusions for vnode-to-tablet migration tests.
#
# Every nemesis runs during the migration except the ones that use a feature
# outside the MS3 scope (SCYLLADB-2455) that is still not supported.
# Sources: the MS3 and MS4 (SCYLLADB-775) epics, and the limitations in
# https://github.com/scylladb/scylladb/blob/master/docs/operating-scylla/procedures/config-change/migrate-vnodes-to-tablets.rst
# When a feature becomes supported, delete its nemeses.
#
# Bootstrap (SCYLLADB-2457, MS4), decommission, removenode, add/remove DC or rack:
#   AbortDecommissionMonkey, AddRemoveDcNemesis, AddRemoveRackNemesis, BootstrapStreamingErrorNemesis,
#   DecommissionMonkey, DecommissionSeedNode, DecommissionStreamingErrMonkey, GrowShrinkClusterNemesis,
#   GrowShrinkZeroTokenNode, IsolateNodeWithIptableRuleNemesis, IsolateNodeWithProcessSignalNemesis,
#   NemesisSequence, TerminateAndRemoveNodeMonkey
# Rebuild: CorruptThenRebuildMonkey, RebuildStreamingErrMonkey
# Repair (SCYLLADB-4498, MS4):
#   CorruptThenRepairMonkey, MgmtCorruptThenRepair, MgmtRepair, NoCorruptRepairMonkey,
#   RepairStreamingErrMonkey, RestartThenRepairNodeMonkey
# Backup and restore (SCYLLADB-4341): MgmtBackup, MgmtBackupSpecificKeyspaces, MgmtRestore
# DROP TABLE and TRUNCATE (SCYLLADB-1098, MS4):
#   EnableDisableTableEncryptionAwsKmsProviderWithRotationMonkey,
#   EnableDisableTableEncryptionAwsKmsProviderWithoutRotationMonkey, TruncateLargeParititionMonkey, TruncateMonkey
# Creating or dropping views and indexes: AddRemoveMvNemesis, CreateIndexNemesis, KillMVBuildingCoordinator
# Only ICS tables can be migrated: ModifyTableCompactionMonkey, ToggleTableIcsMonkey
# CDC (SCYLLADB-1166, MS4): CDCStressorMonkey, ToggleCDCMonkey
# Tablet options on migrating tables (SCYLLADB-2608, MS4): SplitMergeTabletsWithAlter
# Resharding by restart, not covered by MS3: NodeRestartWithResharding

nemesis_class_name: 'SisyphusMonkey'
nemesis_selector: >-
  not AbortDecommissionMonkey
  and not AddRemoveDcNemesis
  and not AddRemoveRackNemesis
  and not BootstrapStreamingErrorNemesis
  and not DecommissionMonkey
  and not DecommissionSeedNode
  and not DecommissionStreamingErrMonkey
  and not GrowShrinkClusterNemesis
  and not GrowShrinkZeroTokenNode
  and not IsolateNodeWithIptableRuleNemesis
  and not IsolateNodeWithProcessSignalNemesis
  and not NemesisSequence
  and not TerminateAndRemoveNodeMonkey
  and not CorruptThenRebuildMonkey
  and not RebuildStreamingErrMonkey
  and not CorruptThenRepairMonkey
  and not MgmtCorruptThenRepair
  and not MgmtRepair
  and not NoCorruptRepairMonkey
  and not RepairStreamingErrMonkey
  and not RestartThenRepairNodeMonkey
  and not MgmtBackup
  and not MgmtBackupSpecificKeyspaces
  and not MgmtRestore
  and not EnableDisableTableEncryptionAwsKmsProviderWithRotationMonkey
  and not EnableDisableTableEncryptionAwsKmsProviderWithoutRotationMonkey
  and not TruncateLargeParititionMonkey
  and not TruncateMonkey
  and not AddRemoveMvNemesis
  and not CreateIndexNemesis
  and not KillMVBuildingCoordinator
  and not ModifyTableCompactionMonkey
  and not ToggleTableIcsMonkey
  and not CDCStressorMonkey
  and not ToggleCDCMonkey
  and not SplitMergeTabletsWithAlter
  and not NodeRestartWithResharding
