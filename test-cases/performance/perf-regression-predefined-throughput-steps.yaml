prepare_write_cmd:
  - >-
    latte run --function=insert --consistency=ALL --threads=7 --concurrency=21 --rate=37500
    --duration=11500000 --start-cycle=1 --end-cycle=11500000
    -P row_count=46000000 -P rows_per_partition=46000
    --tag latte-prepare-01
    data_dir/latte/trie_index.rn
  - >-
    latte run --function=insert --consistency=ALL --threads=7 --concurrency=21 --rate=37500
    --duration=11500000 --start-cycle=11500001 --end-cycle=23000000
    -P row_count=46000000 -P rows_per_partition=46000
    --tag latte-prepare-02
    data_dir/latte/trie_index.rn
  - >-
    latte run --function=insert --consistency=ALL --threads=7 --concurrency=21 --rate=37500
    --duration=11500000 --start-cycle=23000001 --end-cycle=34500000
    -P row_count=46000000 -P rows_per_partition=46000
    --tag latte-prepare-03
    data_dir/latte/trie_index.rn


stress_cmd_w: [
  "cassandra-stress user profile=/tmp/aa-profile.yaml 'ops(insert=1)' cl=QUORUM n=402653184 -mode connectionsPerHost=8 cql3 native -rate 'threads=$threads $throttle' -pop seq=1..402653184",
  "cassandra-stress user profile=/tmp/aa-profile.yaml 'ops(insert=1)' cl=QUORUM n=402653184 -mode connectionsPerHost=8 cql3 native -rate 'threads=$threads $throttle' -pop seq=402653185..805306368",
  "cassandra-stress user profile=/tmp/aa-profile.yaml 'ops(insert=1)' cl=QUORUM n=402653184 -mode connectionsPerHost=8 cql3 native -rate 'threads=$threads $throttle' -pop seq=805306369..1207959552",
  "cassandra-stress user profile=/tmp/aa-profile.yaml 'ops(insert=1)' cl=QUORUM n=402653184 -mode connectionsPerHost=8 cql3 native -rate 'threads=$threads $throttle' -pop seq=1207959553..1610612736"
]

stress_cmd_r:
  - >-
    latte run --function=read --consistency=QUORUM
    --duration=30m --start-cycle=1 --end-cycle=11500000
    -P row_count=46000000 -P rows_per_partition=46000
    data_dir/latte/trie_index.rn
  - >-
    latte run --function=read --consistency=QUORUM
    --duration=30m --start-cycle=11500001 --end-cycle=23000000
    -P row_count=46000000 -P rows_per_partition=46000
    data_dir/latte/trie_index.rn
  - >-
    latte run --function=read --consistency=QUORUM
    --duration=30m --start-cycle=23000001 --end-cycle=34500000
    -P row_count=46000000 -P rows_per_partition=46000
    data_dir/latte/trie_index.rn


stress_cmd_cache_warmup:
  - >-
    latte run --function=read --consistency=QUORUM
    --duration=11500000 --start-cycle=1 --end-cycle=11500000
    -P row_count=46000000 -P rows_per_partition=46000
    data_dir/latte/trie_index.rn
  - >-
    latte run --function=read --consistency=QUORUM
    --duration=11500000 --start-cycle=11500001 --end-cycle=23000000
    -P row_count=46000000 -P rows_per_partition=46000
    data_dir/latte/trie_index.rn
  - >-
    latte run --function=read --consistency=QUORUM
    --duration=11500000 --start-cycle=23000001 --end-cycle=34500000
    -P row_count=46000000 -P rows_per_partition=46000
    data_dir/latte/trie_index.rn

round_robin: true

n_db_nodes: 3
n_loaders: 3

instance_type_db: 'i8g.4xlarge'
instance_type_loader: 'c7i.8xlarge'
instance_type_monitor: 't3.small'
use_capacity_reservation: true
nemesis_add_node_cnt: 0

use_preinstalled_scylla: true

user_prefix: 'perf-regression-predefined-steps'

backtrace_decoding: false

store_perf_results: true
use_mgmt: false
email_recipients: ['jakub.smolar@scylladb.com']

custom_es_index: 'performancestatsv2'
use_hdrhistogram: true

append_scylla_args: '--blocked-reactor-notify-ms 5 --abort-on-lsa-bad-alloc 1 --abort-on-seastar-bad-alloc --abort-on-internal-error 1 --abort-on-ebadf 1'
append_scylla_yaml:
  auto_snapshot: false

use_placement_group: true
use_prepared_loaders: false

adaptive_timeout_store_metrics: false
