test_duration: 600
# 128KB row (16 * 8192), 244GB dataset (2M rows * 128KB)
prepare_write_cmd:  [
  "cassandra-stress write cl=ALL n=30000000 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=25 -pop seq=1..30000000         -col 'n=FIXED(16) size=FIXED(4096)' -log interval=5",
  "cassandra-stress write cl=ALL n=30000000 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=25 -pop seq=30000001..60000000   -col 'n=FIXED(16) size=FIXED(4096)' -log interval=5",
#  "cassandra-stress write cl=ALL n=30000000 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=25 -pop seq=60000001..90000000   -col 'n=FIXED(16) size=FIXED(4096)' -log interval=5",
]


stress_cmd: [
  "cassandra-stress mixed cl=QUORUM duration=600m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=50 -pop seq=1..30000000         -col 'n=FIXED(16) size=FIXED(4096)' -log interval=5",
  "cassandra-stress mixed cl=QUORUM duration=600m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=50 -pop seq=30000001..60000000   -col 'n=FIXED(16) size=FIXED(4096)' -log interval=5",
#  "cassandra-stress mixed cl=QUORUM duration=600m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=50 -pop seq=60000001..90000000   -col 'n=FIXED(16) size=FIXED(4096)' -log interval=5",
]


round_robin: true

n_db_nodes: 15
add_node_cnt: 1
cluster_target_size: 25
n_loaders: 2

# AWS
instance_type_db: 'i4i.large'
instance_type_loader: 'c6i.xlarge'

# GCP
gce_instance_type_db: 'n2-highmem-32'
gce_n_local_ssd_disk_db: 8
gce_instance_type_loader: 'e2-standard-4'

# Azure
azure_instance_type_db: 'Standard_L8s_v3'
azure_instance_type_loader: 'Standard_F4s_v2'

run_fullscan: ['{"mode": "table_and_aggregate", "ks_cf": "keyspace1.standard1", "interval": 10}']

nemesis_class_name: 'SisyphusMonkey'
nemesis_during_prepare: false

user_prefix: 'cluster-base-scale-test'

use_preinstalled_scylla: true

internode_compression: 'all'
